spring.application.name=foodease-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://mysql-3d358828-kudayk59.g.aivencloud.com:26290/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:foodease-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-2026}
app.jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.foodease=INFO
logging.level.org.springframework.security=WARN

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173}
